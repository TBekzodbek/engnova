apply plugin: 'com.android.application'

// ── Release signing ──────────────────────────────────────────────────────
// The upload keystore + its passwords live OUTSIDE version control. This
// block reads them from `android/keystore.properties` (gitignored via the
// blanket `android` entry in .gitignore) so the release build can sign.
//
// When the file is missing (fresh clone, CI without secrets, or a dev
// who hasn't set up signing yet) the release config is skipped and
// `bundleRelease` / `assembleRelease` will fail with a clear "no signing
// config" error — debug builds are completely unaffected.
//
// Setup path: see README.md → "Release build (Play Store)" and
// scripts/generate-upload-keystore.mjs. Template lives at
// keystore.properties.example (copied into android/ by the sync script).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = keystorePropertiesFile.exists() &&
    keystoreProperties['storeFile']     &&
    keystoreProperties['storePassword'] &&
    keystoreProperties['keyAlias']      &&
    keystoreProperties['keyPassword']

android {
    namespace = "uz.engnova.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uz.engnova.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Only registered when the .properties file is present + complete.
        // Registering an incomplete config would fail even for debug builds.
        if (hasReleaseSigning) {
            release {
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
                storeFile     rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                // v1 + v2 + v3 signing so the AAB installs cleanly on every
                // Android version from API 26 (our minSdk) up through current.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // R8 shrinking + resource shrinking. The size delta is meaningful
            // (~40% off the release APK) and the ProGuard rules below keep
            // everything Capacitor accesses via reflection.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Chrome Custom Tabs — used by EngnovaWebViewPlugin to open payment URLs
    // in the system browser with a shared cookie jar (so the merchant session
    // survives the app → browser hand-off cleanly).
    implementation "androidx.browser:browser:1.8.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
